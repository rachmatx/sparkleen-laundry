version: '3.9'

services:
  app:
    build: .
    container_name: sparkleen_app
    working_dir: /app
    environment:
      - CI_ENVIRONMENT=${CI_ENVIRONMENT:-production}
      - database.default.hostname=mysql
      - database.default.database=${DB_NAME:-sparkleen}
      - database.default.username=${DB_USER:-sparkleen}
      - database.default.password=${DB_PASSWORD:-}
    volumes:
      - .:/app
    depends_on:
      - mysql
    networks:
      - sparkleen_network
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    container_name: sparkleen_nginx
    ports:
      - "${PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/app/public:ro
      - ./writable:/app/writable:ro
    depends_on:
      - app
    networks:
      - sparkleen_network
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: sparkleen_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-sparkleen}
      MYSQL_USER: ${DB_USER:-sparkleen}
      MYSQL_PASSWORD: ${DB_PASSWORD:-sparkleen}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - sparkleen_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:

networks:
  sparkleen_network:
    driver: bridge
